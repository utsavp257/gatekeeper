[project]
name = "harness"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pymongo[srv]>=4.8",
    "python-dotenv>=1.0",
    "rapidfuzz>=3.14.6",
    "strands-agents[openai]>=1.57.1",
    "tavily-python>=0.8.4",
    "voyageai>=0.5.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
